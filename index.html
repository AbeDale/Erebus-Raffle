<script>
(() => {
  "use strict";

  const API_STATE_URL = "/api/get-state";
  const DRAW_PERIOD_MS = 12 * 60 * 60 * 1000; // 12 hours

  let nextDrawTimestamp = null;
  let countdownInterval = null;
  let draws = [];

  function shortenAddress(addr) {
    if (!addr || typeof addr !== "string") return addr || "";
    if (addr.length <= 10) return addr;
    return addr.slice(0, 6) + "..." + addr.slice(-4);
  }

  function formatUTC(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toUTCString();
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function renderLatestDraw(list) {
    const container = document.getElementById("latestWinners");
    const metaEl = document.getElementById("latestMeta");
    if (!container || !metaEl) return;

    if (!list || !list.length) {
      container.innerHTML = "";
      metaEl.textContent =
        "No draws fired yet. First one hits when the timer reaches zero.";
      return;
    }

    const latest = list[list.length - 1] || {};
    metaEl.textContent =
      "Round #" +
      (latest.round ?? list.length) +
      " · " +
      formatUTC(latest.executedAt);

    const winnersArr = Array.isArray(latest.winners) ? latest.winners : [];

    if (!winnersArr.length) {
      container.innerHTML =
        "<div>No winners recorded for this round yet.</div>";
      return;
    }

    const rowsHtml = winnersArr
      .map((w) => {
        const rank = w.rank ?? 0;
        const icon = rank === 1 ? "👑" : rank === 2 ? "🥈" : "🥉";
        const label =
          rank === 1 ? "1st winner" : rank === 2 ? "2nd winner" : "3rd winner";

        const tags = [];
        if (w.tokenCount > 0) tags.push(`<span class="tag">Token x${w.tokenCount}</span>`);
        if (w.idPassCount > 0) tags.push(`<span class="tag">ID Pass x${w.idPassCount}</span>`);
        if (w.shadowsCount > 0) tags.push(`<span class="tag">Shadows x${w.shadowsCount}</span>`);

        const hasToken = w.tokenCount > 0;
        const hasId = w.idPassCount > 0;
        const hasShadow = w.shadowsCount > 0;

        if (hasToken && (hasId || hasShadow)) {
          const boosts = hasId && hasShadow ? "Full shadow boost" : "Dual boost";
          tags.push(`<span class="tag tag-boost">${boosts}</span>`);
        }

        const addr = w.address || "-";

        return `
          <div class="winner-row">
            <div class="winner-main">
              <div class="winner-rank-pill">
                <span class="icon">${icon}</span>
                <span>${label}</span>
              </div>
              <div class="winner-addr" title="${addr}">
                ${shortenAddress(addr)}
                <button class="copy-btn" data-address="${addr}">Copy</button>
              </div>
            </div>
            <div class="winner-tags">
              ${tags.join("")}
            </div>
          </div>
        `;
      })
      .join("");

    container.innerHTML = rowsHtml;
  }

  function renderHistory(list) {
    const tbody = document.getElementById("historyBody");
    const metaEl = document.getElementById("historyMeta");
    if (!tbody || !metaEl) return;

    if (!list || !list.length) {
      tbody.innerHTML = "";
      metaEl.textContent = "No draws recorded yet.";
      return;
    }

    metaEl.textContent = `Total rounds recorded: ${list.length}`;

    const rowsHtml = [...list]
      .reverse()
      .map((d) => {
        const winnersArr = Array.isArray(d.winners) ? d.winners : [];

        const first = winnersArr.find((w) => w.rank === 1);
        const second = winnersArr.find((w) => w.rank === 2);
        const third = winnersArr.find((w) => w.rank === 3);

        const fmt = (w) => (w && w.address ? shortenAddress(w.address) : "-");

        return `
          <tr>
            <td class="history-round">#${d.round ?? "?"}</td>
            <td>${formatUTC(d.executedAt)}</td>
            <td class="history-winners">
              1st: ${fmt(first)} |
              2nd: ${fmt(second)} |
              3rd: ${fmt(third)}
            </td>
          </tr>
        `;
      })
      .join("");

    tbody.innerHTML = rowsHtml;
  }

  function startCountdown() {
    if (!nextDrawTimestamp) {
      setText(
        "drawStatus",
        "No next draw scheduled yet. Waiting for backend timestamp..."
      );
      return;
    }

    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    const tick = () => {
      const now = Date.now();
      const diff = nextDrawTimestamp - now;

      if (diff <= 0) {
        setText("cd-hours", "00");
        setText("cd-minutes", "00");
        setText("cd-seconds", "00");
        setText(
          "drawStatus",
          "Snapshot taken. Waiting for the backend to finalize the draw and publish the next round..."
        );
        clearInterval(countdownInterval);
        countdownInterval = null;
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      setText("cd-hours", String(hours).padStart(2, "0"));
      setText("cd-minutes", String(minutes).padStart(2, "0"));
      setText("cd-seconds", String(seconds).padStart(2, "0"));

      if (hours === 0 && minutes < 10) {
        setText(
          "timerNote",
          "We’re less than 10 minutes from the next raffle. Any last-minute shadow moves will be tracked."
        );
      } else {
        setText(
          "timerNote",
          "This timer is global. Every wallet sees the same countdown and the same winners."
        );
      }
    };

    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  function applyStateFromServer(raw) {
    console.log("Erebus state payload:", raw);

    let payload = raw;
    if (Array.isArray(raw)) payload = raw[0];
    if (raw && raw.state) payload = raw.state;

    if (!payload) {
      setText(
        "drawStatus",
        "Failed to sync raffle state (empty payload)."
      );
      return;
    }

    // ---- NEW GLOBAL TIMER LOGIC ----
    // Use next_draw_at as base anchor, then advance in 12h steps.
    const iso =
      payload.next_draw_at ||
      payload.nextDrawAt ||
      payload.next_draw_at_utc ||
      payload.next_draw_time;

    let ts = null;
    if (iso) {
      const baseTs = Date.parse(iso);
      if (!Number.isNaN(baseTs)) {
        const now = Date.now();
        ts = baseTs;
        // move forward in 12h increments until in the future
        while (ts <= now) {
          ts += DRAW_PERIOD_MS;
        }

        setText(
          "drawStatus",
          `Raffle state synced. Draws are every 12 hours from ${new Date(
            baseTs
          ).toUTCString()}.`
        );
      }
    }

    // Fallback: if timestamp still missing/invalid, just start 12h from now
    if (!ts) {
      const now = Date.now();
      ts = now + DRAW_PERIOD_MS;
      setText(
        "drawStatus",
        "Backend timestamp invalid/missing. Using local 12-hour cycle from now."
      );
    }

    nextDrawTimestamp = ts;

    // Winner history
    draws = payload.draws || payload.history || [];
    renderLatestDraw(draws);
    renderHistory(draws);

    startCountdown();
  }

  async function fetchState() {
    try {
      setText("drawStatus", "Syncing with Erebus raffle oracle...");
      const res = await fetch(API_STATE_URL, { cache: "no-store" });
      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }
      const data = await res.json();
      applyStateFromServer(data);
    } catch (err) {
      console.error("Error fetching state:", err);
      setText(
        "drawStatus",
        "Error fetching raffle state. Check console / network and refresh."
      );
    }
  }

  function setupCopyButtons() {
    document.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".copy-btn");
      if (!btn) return;

      const addr = btn.getAttribute("data-address");
      if (!addr) return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(addr)
          .then(() => {
            btn.textContent = "Copied";
            setTimeout(() => {
              btn.textContent = "Copy";
            }, 1200);
          })
          .catch(() => {
            alert(
              "Could not copy address. You can still select it manually."
            );
          });
      } else {
        alert(
          "Clipboard API not available. Please select and copy manually."
        );
      }
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    setupCopyButtons();
    fetchState();
    // Refresh state every 5 min so long-open tabs get history updates
    setInterval(fetchState, 5 * 60 * 1000);
  });
})();
</script>
