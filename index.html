<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Erebus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #100b1f 0%, #040308 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", sans-serif;
    }

    .smoke {
      position: absolute;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle at 40% 30%, rgba(120,0,255,0.2), transparent 70%),
                  radial-gradient(circle at 70% 60%, rgba(80,0,180,0.15), transparent 80%),
                  radial-gradient(circle at 50% 50%, rgba(200,0,255,0.08), transparent 100%);
      mix-blend-mode: lighten;
      filter: blur(100px);
      animation: drift 60s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); }
      50% { transform: scale(1.3) translate(-30px, -40px) rotate(5deg); }
      100% { transform: scale(1) translate(30px, 50px) rotate(-5deg); }
    }

    .center-logo {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .center-logo h1 {
      font-size: 3rem;
      letter-spacing: 0.15em;
      color: transparent;
      background: linear-gradient(120deg, #b999ff, #7b41ff, #b999ff);
      background-clip: text;
      -webkit-background-clip: text;
      text-transform: uppercase;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 10px #7b41ff); }
      50% { opacity: 1; filter: drop-shadow(0 0 25px #b999ff); }
    }

    .fog-layer {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 80%);
      opacity: 0.2;
      filter: blur(80px);
      animation: fogmove 100s linear infinite;
    }

    @keyframes fogmove {
      from { transform: translateX(0) rotate(0deg); }
      to { transform: translateX(50px) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="smoke"></div>
  <div class="fog-layer"></div>
  <div class="center-logo">
    <h1>Erebus</h1>
  </div>
</body>
</html>
