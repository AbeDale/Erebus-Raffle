<script>
  // ---------------- CONFIG ----------------
  const API_STATE_URL = "/api/get-state";
  const API_DRAW_URL  = "/api/save-draw";

  let nextDrawTimestamp = null;
  let countdownInterval = null;
  let drawInFlight = false;
  let drawHistory = [];

  // --------------- HELPERS -----------------
  function shortenAddress(addr) {
    if (!addr || addr.length < 10) return addr || "";
    return addr.slice(0, 6) + "..." + addr.slice(-4);
  }

  function formatUTC(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toUTCString();
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  // ----------- RENDER: LATEST DRAW ----------
  function renderLatestDraw(draws) {
    const container = document.getElementById("latestWinners");
    const metaEl = document.getElementById("latestMeta");

    if (!draws || !draws.length) {
      container.innerHTML = "";
      metaEl.textContent =
        "No draws fired yet. First one hits when the timer reaches zero.";
      return;
    }

    const latest = draws[draws.length - 1];
    metaEl.textContent = `Round #${latest.round} · ${formatUTC(latest.executedAt)}`;

    if (!latest.winners || !latest.winners.length) {
      container.innerHTML = "<div>No winners recorded for this round.</div>";
      return;
    }

    const rowsHtml = latest.winners
      .map((w) => {
        const icon = w.rank === 1 ? "👑" : w.rank === 2 ? "🥈" : "🥉";
        const label =
          w.rank === 1 ? "1st winner" : w.rank === 2 ? "2nd winner" : "3rd winner";
        const shortAddr = shortenAddress(w.address);

        const tags = [];

        if (w.tokenCount && w.tokenCount > 0) {
          tags.push(`<span class="tag">Token x${w.tokenCount}</span>`);
        }
        if (w.idPassCount && w.idPassCount > 0) {
          tags.push(`<span class="tag">ID Pass x${w.idPassCount}</span>`);
        }
        if (w.shadowsCount && w.shadowsCount > 0) {
          tags.push(`<span class="tag">Shadows x${w.shadowsCount}</span>`);
        }

        const hasToken = w.tokenCount && w.tokenCount > 0;
        const hasId = w.idPassCount && w.idPassCount > 0;
        const hasShadow = w.shadowsCount && w.shadowsCount > 0;

        if (hasToken && (hasId || hasShadow)) {
          const boosts = hasId && hasShadow ? "Full shadow boost" : "Dual boost";
          tags.push(`<span class="tag tag-boost">${boosts}</span>`);
        }

        return `
          <div class="winner-row">
            <div class="winner-main">
              <div class="winner-rank-pill">
                <span class="icon">${icon}</span>
                <span>${label}</span>
              </div>
              <div class="winner-addr" title="${w.address}">
                ${shortAddr}
                <button class="copy-btn" data-address="${w.address}">Copy</button>
              </div>
            </div>
            <div class="winner-tags">
              ${tags.join("")}
            </div>
          </div>
        `;
      })
      .join("");

    container.innerHTML = rowsHtml;
  }

  // ------------- RENDER: HISTORY ------------
  function renderHistory(draws) {
    const tbody = document.getElementById("historyBody");
    const metaEl = document.getElementById("historyMeta");

    if (!draws || !draws.length) {
      tbody.innerHTML = "";
      metaEl.textContent = "No draws recorded yet.";
      return;
    }

    metaEl.textContent = `Total rounds recorded: ${draws.length}`;

    const rowsHtml = [...draws]
      .reverse()
      .map((d) => {
        const first = d.winners?.find((w) => w.rank === 1);
        const second = d.winners?.find((w) => w.rank === 2);
        const third = d.winners?.find((w) => w.rank === 3);

        function fmtWinner(w) {
          if (!w) return "-";
          return shortenAddress(w.address || "-");
        }

        return `
          <tr>
            <td class="history-round">#${d.round}</td>
            <td>${formatUTC(d.executedAt)}</td>
            <td class="history-winners">
              1st: ${fmtWinner(first)} |
              2nd: ${fmtWinner(second)} |
              3rd: ${fmtWinner(third)}
            </td>
          </tr>
        `;
      })
      .join("");

    tbody.innerHTML = rowsHtml;
  }

  // ---------------- COUNTDOWN ----------------
  function startCountdown() {
    if (!nextDrawTimestamp) {
      console.warn("startCountdown called but nextDrawTimestamp is null");
      return;
    }

    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    function tick() {
      const now = Date.now();
      const diff = nextDrawTimestamp - now;

      if (diff <= 0) {
        setText("cd-hours", "00");
        setText("cd-minutes", "00");
        setText("cd-seconds", "00");

        clearInterval(countdownInterval);
        countdownInterval = null;

        if (!drawInFlight) {
          // ask backend to run the draw
          triggerDraw();
        }
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      setText("cd-hours", String(hours).padStart(2, "0"));
      setText("cd-minutes", String(minutes).padStart(2, "0"));
      setText("cd-seconds", String(seconds).padStart(2, "0"));

      if (hours === 0 && minutes < 10) {
        setText(
          "timerNote",
          "We’re less than 10 minutes from the next raffle. Any last-minute shadow moves will be tracked."
        );
      } else {
        setText(
          "timerNote",
          "This timer is server-driven. Everyone sees the same countdown and the same winners."
        );
      }
    }

    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  // ------------- STATE FROM BACKEND ----------
  async function fetchState() {
    try {
      setText("drawStatus", "Syncing with Erebus raffle oracle...");

      const res = await fetch(API_STATE_URL, { cache: "no-store" });

      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }

      const raw = await res.json();
      applyStateFromServer(raw);
    } catch (err) {
      console.error("Error fetching state:", err);
      setText(
        "drawStatus",
        "Error fetching raffle state. Check console / network and refresh."
      );
    }
  }

  function applyStateFromServer(raw) {
    console.log("Erebus state payload:", raw);

    let payload = raw;
    if (raw && raw.state) payload = raw.state;
    if (Array.isArray(raw)) payload = raw[0];

    if (!payload) {
      setText("drawStatus", "Failed to sync raffle state (empty payload).");
      return;
    }

    const iso =
      payload.next_draw_at ||
      payload.nextDrawAt ||
      payload.next_draw_at_utc ||
      payload.next_draw_time;

    if (!iso) {
      setText(
        "drawStatus",
        "Raffle state loaded but next_draw_at is missing. Backend must set this field."
      );
      return;
    }

    const ts = Date.parse(iso);

    if (!Number.isFinite(ts)) {
      setText(
        "drawStatus",
        "Raffle state loaded but timestamp is invalid: " + iso
      );
      return;
    }

    // this is the authoritative server timestamp
    nextDrawTimestamp = ts;

    // winner history
    drawHistory = payload.draws || payload.winners || [];
    renderLatestDraw(drawHistory);
    renderHistory(drawHistory);

    // kick off / restart countdown
    startCountdown();

    const now = new Date();
    setText(
      "drawStatus",
      `Next shadow draw countdown is live. Last sync: ${now.toUTCString()}`
    );
  }

  // ---------------- RUN DRAW -----------------
  async function triggerDraw() {
    drawInFlight = true;
    setText(
      "drawStatus",
      "Timer hit zero. Freezing snapshot & running the draw on the server…"
    );

    try {
      const res = await fetch(API_DRAW_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ action: "runDrawFromUI" })
      });

      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }

      const data = await res.json();
      applyStateFromServer(data);
    } catch (err) {
      console.error("Error running draw:", err);
      setText(
        "drawStatus",
        "Failed to run draw on the server. The backend will retry when available. Snapshot taken. Waiting for the backend to finalize the draw..."
      );
    } finally {
      drawInFlight = false;
    }
  }

  // ---------------- COPY BUTTONS -------------
  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".copy-btn");
    if (!btn) return;

    const addr = btn.getAttribute("data-address");
    if (!addr) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard
        .writeText(addr)
        .then(() => {
          btn.textContent = "Copied";
          setTimeout(() => {
            btn.textContent = "Copy";
          }, 1200);
        })
        .catch(() => {
          alert("Could not copy address. You can still select it manually.");
        });
    } else {
      alert("Clipboard API not available. Please select and copy manually.");
    }
  });

  // ---------------- INIT ---------------------
  fetchState();
  // keep tabs in sync
  setInterval(fetchState, 5 * 60 * 1000);
</script>
