<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Erebus Raffle Observatory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Ethers.js -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#050008;
      color:#f7f3ff;
      font-family: system-ui, sans-serif;
    }
    .erebus-bg {
      position:fixed; inset:0;
      background:
        radial-gradient(circle at 10% 5%, rgba(196,77,255,0.32) 0, transparent 55%),
        radial-gradient(circle at 85% 85%, rgba(0,209,255,0.35) 0, transparent 55%),
        radial-gradient(circle at 30% 80%, rgba(255,56,190,0.19) 0, transparent 60%),
        radial-gradient(circle at 50% 50%, #050008 0, #170019 40%, #010004 100%);
      animation:fade 14s ease-in-out infinite alternate;
      z-index:-1;
    }
    @keyframes fade {
      0% { transform:scale(1.02); filter:brightness(1); }
      100% { transform:scale(1.05); filter:brightness(1.06); }
    }
    .page {
      padding:25px;
      max-width:1200px;
      margin:auto;
    }
    .brand {
      display:flex; align-items:center; gap:16px;
    }
    .brand-logo {
      width:60px; height:60px; border-radius:50%;
      overflow:hidden;
      box-shadow:0 0 22px rgba(210,143,255,0.9);
    }
    .brand-logo img { width:100%; height:100%; object-fit:contain; }
    h1 {
      font-size:1.8rem;
      text-transform:uppercase;
      letter-spacing:0.1em;
      text-shadow:0 0 15px rgba(200,160,255,0.9);
    }
    .card {
      background: radial-gradient(circle at top, rgba(122,88,255,0.25), rgba(7,0,18,0.95));
      padding:20px;
      border-radius:20px;
      margin-top:25px;
      border:1px solid rgba(193,140,255,0.9);
      box-shadow:0 30px 80px rgba(0,0,0,0.9);
    }
    .countdown {
      display:flex; gap:14px; margin-top:15px;
    }
    .time-box {
      flex:1;
      background:#120018;
      border:1px solid rgba(170,130,255,0.7);
      border-radius:18px;
      padding:15px;
      text-align:center;
    }
    .time-value {
      font-size:2rem;
      text-shadow:0 0 12px rgba(255,219,255,0.9);
    }
    .winner-card {
      background:#150022;
      border:1px solid rgba(150,100,255,0.9);
      border-radius:12px;
      padding:12px;
      margin-top:10px;
    }
    .tag {
      display:inline-block;
      padding:3px 7px;
      border-radius:12px;
      margin-right:5px;
      font-size:0.75rem;
      background:#320042;
      border:1px solid #8b59ff;
    }
    .tag-boost { background:#256c39; border-color:#78e89f; }
  </style>
</head>

<body>
<div class="erebus-bg"></div>

<div class="page">

  <!-- HEADER -->
  <div class="brand">
    <div class="brand-logo"><img src="./erebus-logo.png"></div>
    <div>
      <h1>Erebus Raffle Observatory</h1>
      <p>Tracking Erebus: Token + ID Pass + Shadows on Monad Testnet</p>
    </div>
  </div>

  <!-- COUNTDOWN CARD -->
  <div class="card">
    <h2>Next Shadow Draw</h2>

    <div class="countdown">
      <div class="time-box">
        <div class="time-value" id="h">--</div>
        <div>Hours</div>
      </div>
      <div class="time-box">
        <div class="time-value" id="m">--</div>
        <div>Minutes</div>
      </div>
      <div class="time-box">
        <div class="time-value" id="s">--</div>
        <div>Seconds</div>
      </div>
    </div>

    <p id="status" style="margin-top:10px; opacity:0.8;">Preparing…</p>
  </div>

  <!-- WINNERS -->
  <div class="card">
    <h2>Latest Draw Results</h2>
    <p id="wmeta" style="opacity:0.8;">Waiting for first draw…</p>
    <div id="winners"></div>
  </div>

</div>

<script>
/* ---------------- CONFIG ---------------- */
const RPC = "https://testnet-rpc.monad.xyz";
const ABI = ["function ownerOf(uint256) view returns (address)"];

const CONTRACTS = {
  token:   "0xa901eb1f392ada46d88da272488a1af753d69f9b",
  idpass:  "0x86942cf234ba763b3c95cae7f63dcf17abc56add",
  shadow:  "0x7fd12335de83500b8ff39c206398c55466235160"
};

const MAX_SUPPLY = 500;

/* ---------------- TIMER ---------------- */
function getNextTimestamp() {
  let t = localStorage.getItem("erebus_nextDraw");
  if (t) return Number(t);

  let next = Date.now() + 2 * 3600 * 1000;  // start with 2 hours
  localStorage.setItem("erebus_nextDraw", next);
  return next;
}

function setNext12() {
  let next = Date.now() + 12 * 3600 * 1000;
  localStorage.setItem("erebus_nextDraw", next);
  return next;
}

let nextDraw = getNextTimestamp();

/* ------------- HOLDER SCAN ------------- */
async function scanContract(address) {
  const provider = new ethers.JsonRpcProvider(RPC);
  const c = new ethers.Contract(address, ABI, provider);
  const map = new Map();

  for (let i = 0; i < MAX_SUPPLY; i++) {
    try {
      let o = await c.ownerOf(i);
      if (o && o !== ethers.ZeroAddress) {
        o = o.toLowerCase();
        map.set(o, (map.get(o) || 0) + 1);
      }
    } catch {}
  }
  return map;
}

/* ------------- PICK WINNERS ------------- */
function pickRandom(arr, count) {
  const copy = [...arr];
  const out = [];
  while(out.length < count && copy.length > 0) {
    const r = Math.floor(Math.random() * copy.length);
    out.push(copy.splice(r, 1)[0]);
  }
  return out;
}

/* ------------- RENDER ------------------- */
function shorten(a){ return a.slice(0,6)+"..."+a.slice(-4); }

function renderWinner(addr, t, id, sh) {
  let tags = [];
  if(t>0) tags.push(`<span class="tag">Token x${t}</span>`);
  if(id>0) tags.push(`<span class="tag">ID x${id}</span>`);
  if(sh>0) tags.push(`<span class="tag">Shadow x${sh}</span>`);

  if(t>0 && id>0 && sh>0) tags.push(`<span class="tag tag-boost">Full Boost</span>`);
  else if(t>0 && (id>0 || sh>0)) tags.push(`<span class="tag tag-boost">Dual Boost</span>`);

  return `
    <div class="winner-card">
      <div><strong>${shorten(addr)}</strong></div>
      <div style="margin-top:5px;">${tags.join(" ")}</div>
    </div>
  `;
}

/* ------------- MAIN DRAW LOGIC ---------- */
async function doDraw() {
  document.getElementById("status").textContent = "Drawing winners…";

  const tokenMap  = await scanContract(CONTRACTS.token);
  const idMap     = await scanContract(CONTRACTS.idpass);
  const shMap     = await scanContract(CONTRACTS.shadow);

  const eligible = [...tokenMap.keys()];
  const winners = pickRandom(eligible, 3);

  const panel = document.getElementById("winners");
  panel.innerHTML = winners.map(a => {
    return renderWinner(
      a,
      tokenMap.get(a) || 0,
      idMap.get(a)    || 0,
      shMap.get(a)    || 0
    );
  }).join("");

  document.getElementById("wmeta").textContent =
    "Draw executed at: " + new Date().toLocaleString();

  nextDraw = setNext12();
}

/* ------------- TIMER LOOP --------------- */
function loop() {
  const now = Date.now();
  let diff = nextDraw - now;

  if(diff <= 0) {
    doDraw();
    return;
  }

  let s = Math.floor(diff / 1000);
  let h = Math.floor(s / 3600);
  s %= 3600;
  let m = Math.floor(s / 60);
  s %= 60;

  document.getElementById("h").textContent = String(h).padStart(2,"0");
  document.getElementById("m").textContent = String(m).padStart(2,"0");
  document.getElementById("s").textContent = String(s).padStart(2,"0");

  document.getElementById("status").textContent =
    "Next draw when timer hits zero.";

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
