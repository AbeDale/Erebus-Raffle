<script>
  // ------- SIMPLE EREBUS OBSERVER (NO /api/save-draw, NO TRIGGERDRAWS) -------

  const API_STATE_URL = "/api/get-state";
  const TWELVE_HOURS_MS = 12 * 60 * 60 * 1000;

  let nextDrawTimestamp = null;
  let countdownInterval = null;
  let drawsCache = [];

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function shortenAddress(addr) {
    if (!addr || typeof addr !== "string") return addr || "";
    if (addr.length <= 12) return addr;
    return addr.slice(0, 6) + "..." + addr.slice(-4);
  }

  function formatUTC(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toUTCString();
  }

  // ---------- RENDER LATEST DRAW ----------
  function renderLatestDraw(draws) {
    const container = document.getElementById("latestWinners");
    const metaEl = document.getElementById("latestMeta");
    if (!container || !metaEl) return;

    if (!Array.isArray(draws) || !draws.length) {
      container.innerHTML = "";
      metaEl.textContent =
        "No draws fired yet. First one hits when the timer reaches zero.";
      return;
    }

    const latest = draws[draws.length - 1];
    metaEl.textContent = `Round #${latest.round ?? "?"} · ${formatUTC(
      latest.executedAt
    )}`;

    if (!Array.isArray(latest.winners) || !latest.winners.length) {
      container.innerHTML = "<div>No winners recorded for this round.</div>";
      return;
    }

    const rowsHtml = latest.winners
      .map((w) => {
        const rank = w.rank ?? 1;
        const icon = rank === 1 ? "👑" : rank === 2 ? "🥈" : "🥉";
        const label =
          rank === 1 ? "1st winner" : rank === 2 ? "2nd winner" : "3rd winner";
        const shortAddr = shortenAddress(w.address);

        const tags = [];
        if (w.tokenCount && w.tokenCount > 0) {
          tags.push(`<span class="tag">Token x${w.tokenCount}</span>`);
        }
        if (w.idPassCount && w.idPassCount > 0) {
          tags.push(`<span class="tag">ID Pass x${w.idPassCount}</span>`);
        }
        if (w.shadowsCount && w.shadowsCount > 0) {
          tags.push(`<span class="tag">Shadows x${w.shadowsCount}</span>`);
        }

        const hasToken = w.tokenCount && w.tokenCount > 0;
        const hasId = w.idPassCount && w.idPassCount > 0;
        const hasShadow = w.shadowsCount && w.shadowsCount > 0;

        if (hasToken && (hasId || hasShadow)) {
          const boosts = hasId && hasShadow ? "Full shadow boost" : "Dual boost";
          tags.push(`<span class="tag tag-boost">${boosts}</span>`);
        }

        return `
          <div class="winner-row">
            <div class="winner-main">
              <div class="winner-rank-pill">
                <span class="icon">${icon}</span>
                <span>${label}</span>
              </div>
              <div class="winner-addr" title="${w.address || ""}">
                ${shortAddr}
                <button class="copy-btn" data-address="${w.address || ""}">Copy</button>
              </div>
            </div>
            <div class="winner-tags">
              ${tags.join("")}
            </div>
          </div>
        `;
      })
      .join("");

    container.innerHTML = rowsHtml;
  }

  // ---------- RENDER HISTORY ----------
  function renderHistory(draws) {
    const tbody = document.getElementById("historyBody");
    const metaEl = document.getElementById("historyMeta");
    if (!tbody || !metaEl) return;

    if (!Array.isArray(draws) || !draws.length) {
      tbody.innerHTML = "";
      metaEl.textContent = "No draws recorded yet.";
      return;
    }

    metaEl.textContent = `Total rounds recorded: ${draws.length}`;

    const rowsHtml = [...draws]
      .reverse()
      .map((d) => {
        const first = d.winners?.find((w) => w.rank === 1);
        const second = d.winners?.find((w) => w.rank === 2);
        const third = d.winners?.find((w) => w.rank === 3);

        const fmt = (w) => (w ? shortenAddress(w.address || "-") : "-");

        return `
          <tr>
            <td class="history-round">#${d.round ?? "?"}</td>
            <td>${formatUTC(d.executedAt)}</td>
            <td class="history-winners">
              1st: ${fmt(first)} |
              2nd: ${fmt(second)} |
              3rd: ${fmt(third)}
            </td>
          </tr>
        `;
      })
      .join("");

    tbody.innerHTML = rowsHtml;
  }

  // ---------- COUNTDOWN ----------
  function startCountdown() {
    if (!nextDrawTimestamp) {
      console.warn("startCountdown called but nextDrawTimestamp is null");
      return;
    }

    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    function tick() {
      const now = Date.now();
      let diff = nextDrawTimestamp - now;
      if (diff < 0) diff = 0;

      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      setText("cd-hours", String(hours).padStart(2, "0"));
      setText("cd-minutes", String(minutes).padStart(2, "0"));
      setText("cd-seconds", String(seconds).padStart(2, "0"));

      if (diff === 0) {
        setText(
          "drawStatus",
          "Countdown reached zero. Waiting for the Erebus backend to finalize the draw or schedule the next one…"
        );
        setText(
          "timerNote",
          "As soon as next_draw_at moves forward on the backend, this page will sync to the next 12-hour cycle."
        );
        return;
      }

      if (hours === 0 && minutes < 10) {
        setText(
          "timerNote",
          "We’re less than 10 minutes from the next raffle. Any last-minute shadow moves will be tracked."
        );
      } else {
        setText(
          "timerNote",
          "This timer is global. Every wallet sees the same countdown and the same winners."
        );
      }
    }

    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  // ---------- STATE HANDLING ----------
  function normaliseDraws(payload) {
    if (Array.isArray(payload.draws)) return payload.draws;
    if (Array.isArray(payload.history)) return payload.history;
    if (Array.isArray(payload.rounds)) return payload.rounds;

    if (Array.isArray(payload.winners) && payload.winners.length) {
      return [
        {
          round: payload.round || 1,
          executedAt: payload.executed_at || payload.next_draw_at || null,
          winners: payload.winners
        }
      ];
    }

    return [];
  }

  function applyStateFromServer(raw) {
    console.log("Erebus state payload:", raw);

    let payload = raw;
    if (Array.isArray(raw) && raw.length) payload = raw[0];
    if (raw && raw.state) payload = raw.state;

    if (!payload) {
      setText(
        "drawStatus",
        "Failed to sync raffle state (empty payload from backend)."
      );
      return;
    }

    // your Supabase row shape: { id, round, next_draw_at, winners: [] }
    const iso = payload.next_draw_at || payload.nextDrawAt;
    if (!iso) {
      setText(
        "drawStatus",
        "Raffle state loaded but next_draw_at is missing. Ask the backend to store it."
      );
      return;
    }

    let ts = Date.parse(iso);
    if (!Number.isFinite(ts)) {
      setText(
        "drawStatus",
        "Raffle state loaded but timestamp is invalid: " + iso
      );
      return;
    }

    const now = Date.now();
    while (ts <= now) {
      ts += TWELVE_HOURS_MS;
    }

    nextDrawTimestamp = ts;

    drawsCache = normaliseDraws(payload);
    renderLatestDraw(drawsCache);
    renderHistory(drawsCache);

    setText(
      "drawStatus",
      "Next shadow draw countdown is live. Last sync: " +
        new Date().toUTCString()
    );

    startCountdown();
  }

  async function fetchState() {
    try {
      setText("drawStatus", "Syncing with Erebus raffle oracle…");
      const res = await fetch(API_STATE_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      applyStateFromServer(data);
    } catch (err) {
      console.error("Error fetching state:", err);
      setText(
        "drawStatus",
        "Error fetching raffle state. Check console / network and refresh."
      );
    }
  }

  // ---------- COPY BUTTONS ----------
  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".copy-btn");
    if (!btn) return;
    const addr = btn.getAttribute("data-address");
    if (!addr) return;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard
        .writeText(addr)
        .then(() => {
          btn.textContent = "Copied";
          setTimeout(() => (btn.textContent = "Copy"), 1200);
        })
        .catch(() => {
          alert("Could not copy address. Please select it manually.");
        });
    } else {
      alert("Clipboard API not available. Please select and copy manually.");
    }
  });

  // ---------- INIT ----------
  fetchState();
  setInterval(fetchState, 5 * 60 * 1000);
</script>
